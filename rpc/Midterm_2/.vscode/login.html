<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="login.css">
<script>

function HandleLoginResponse(response)
{
	var text = JSON.parse(response);
	document.getElementById("textResponse").innerHTML = "response: "+text+"<p>";

	if(text.status == "authorized"){
		window.location.href = "welcome.html";
	}
}

function SendLoginRequest(username,password)
{
	var request = new XMLHttpRequest();
	request.open("POST","login.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLoginResponse(this.responseText);
		}		
	}
	request.send("type=login&uname="+username+"&pword="+password);
}

function SendRegisterRequest(username,password)
{
	var request = new XMLHttpRequest();
	request.open("POST","login.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLoginResponse(this.responseText);
		}		
	}
	request.send("type=register&uname="+username+"&pword="+password);
}

</script>
</head>
<body>
<div class="top-auth-actions">
	<button type="button" id="openLogin">Login</button>
	<button type="button" id="openRegister">Register</button>
</div>

<h1>Welcome to Team Cyber's Site</h1>
<div id="textResponse">
</div>

<div class="container" id="authContainer">
	<div class="card-header">
		<h2 id="formTitle">Login</h2>
		<button type="button" id="closeForm" class="close-btn">X</button>
	</div>

	<input type="text" id="username" placeholder="Username" required>

	<input type="password" id="password" placeholder="Password" required>

	<div class="actions">
		<button type="button" id="submitAuth">Login</button>
	</div>

	<p id="formHint">Enter your username and password to login.</p>

</div>

<script>
var authMode = "login";

document.getElementById("openLogin").addEventListener("click", function(){
	showAuthForm("login");
});

document.getElementById("openRegister").addEventListener("click", function(){
	showAuthForm("register");
});

document.getElementById("closeForm").addEventListener("click", function(){
	document.getElementById("authContainer").classList.remove("show");
});

document.getElementById("submitAuth").addEventListener("click", SubmitAuth);

function showAuthForm(mode){
	authMode = mode;
	document.getElementById("authContainer").classList.add("show");

	if(mode === "register"){
		document.getElementById("formTitle").innerHTML = "Register";
		document.getElementById("submitAuth").innerHTML = "Register";
		document.getElementById("formHint").innerHTML = "Create an account with username and password.";
	} else {
		document.getElementById("formTitle").innerHTML = "Login";
		document.getElementById("submitAuth").innerHTML = "Login";
		document.getElementById("formHint").innerHTML = "Enter your username and password to login.";
	}
}

function SubmitAuth(){
	username = document.getElementById("username").value;
	password = document.getElementById("password").value;

	if(authMode === "register"){
		SendRegisterRequest(username, password);
		return;
	}

	SendLoginRequest(username, password);
}

function GetLogInfo(){
	username = document.getElementById("username").value;
	password = document.getElementById("password").value;
	SendLoginRequest(username, password);
}

function GetRegInfo(){
	username = document.getElementById("username").value;
	password = document.getElementById("password").value;
	SendRegisterRequest(username, password);
}

</script>
</body>
</html>
