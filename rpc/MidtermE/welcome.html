<script>
let allMovies = [];
async function loadMovies(){
const movieContainer = document.getElementById("movieContainer");
movieContainer.innerHTML = '<div class="status-box">Loading movies...</div>';

try{
const response = await fetch("movies.php");
const data = await response.json();

if(!data.success){
movieContainer.innerHTML = '<div class="status-box">Could not load movies.</div>';
return;
}

allMovies = data.movies || [];
displayMovies(allMovies);
}catch(error){
movieContainer.innerHTML =
'<div class="status-box">Error fetching movies from movies.php</div>';
}

}

/* DISPLAY MOVIES */

function displayMovies(movies){

const movieContainer = document.getElementById("movieContainer");

if(movies.length === 0){
movieContainer.innerHTML =
'<div class="status-box">No movies found.</div>';
return;
}

movieContainer.innerHTML = "";

movies.forEach(movie => {

const poster = movie.poster_path
? "https://image.tmdb.org/t/p/w500" + movie.poster_path
: "https://via.placeholder.com/500x750?text=No+Image";

const title = movie.title ? escapeHtml(movie.title) : "Untitled";

const releaseDate = movie.release_date
? escapeHtml(movie.release_date)
: "N/A";
let overview = "No description available.";




if(movie.overview){

overview = movie.overview.length > 120
? movie.overview.substring(0,120) + "..."
: movie.overview;

overview = escapeHtml(overview);

}

const card = document.createElement("div");

card.className = "movie-card";

card.innerHTML = `
<img class="movie-poster" src="${poster}" alt="${title}">
<div class="movie-info">
<div class="movie-title">${title}</div>
<div class="movie-date">Release: ${releaseDate}</div>
<div class="movie-overview">${overview}</div>
</div>
`;

movieContainer.appendChild(card);

});

}

/*?php echo $fullName; ?>*/









/* SEARCH MOVIES */

function searchMovies(){

const input = document
.getElementById("searchInput")
.value
.toLowerCase();

const filtered = allMovies.filter(movie =>

movie.title &&
movie.title.toLowerCase().includes(input)

);

displayMovies(filtered);

}

/* SECURITY */

function escapeHtml(text){

const div = document.createElement("div");

div.textContent = text;

return div.innerHTML;

}

loadMovies();

</script>
