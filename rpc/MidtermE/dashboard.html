
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Dashboard</title>

<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="topnav">

<div class="logo">MovieDB</div>

<div class="search-bar">
<input 
type="text"
id="searchInput"
placeholder="Search movies..."
onkeyup="searchMovies()"
>
</div>

<div class="auth-buttons">
<a href="index.html#login" class="button-link">
<button>Sign/Register</button>
</a>
</div>

</div>

<div class="hero">
<h1>Welcome to the Movie Dashboard</h1>
<p>Discover the latest movies from the <strong>TMDB API</strong>.</p>
</div>

<div class="content">

<div class="section-header">
<h2>Popular Movies</h2>
<button class="refresh-btn" onclick="loadMovies()">Refresh Movies</button>
</div>

<div id="movieContainer">
<div class="status-box">Loading movies...</div>
</div>

</div>

<script>

let allMovies = [];


async function loadMovies(){

const movieContainer = document.getElementById("movieContainer");

movieContainer.innerHTML =
'<div class="status-box">Loading movies...</div>';

try{

const apiKey = "c4272095443f1ac76fd5bc1f62cd5790";
const response = await fetch(
`https://api.themoviedb.org/3/movie/popular?api_key=${apiKey}`
);
const data = await response.json();

allMovies = data.results || [];

displayMovies(allMovies);

}catch(error){

movieContainer.innerHTML =
'<div class="status-box">Error fetching movies from API</div>';

}

}

/* DISPLAY MOVIES */

function displayMovies(movies){

const movieContainer =
document.getElementById("movieContainer");

if(movies.length === 0){

movieContainer.innerHTML =
'<div class="status-box">No movies found.</div>';

return;

}

movieContainer.innerHTML = "";

movies.forEach(movie => {

const poster = getPosterUrl(movie);

const title =
movie.title ? escapeHtml(movie.title) : "Untitled";

const releaseDate =
movie.release_date ? escapeHtml(movie.release_date) : "N/A";

let overview = "No description available.";

if(movie.overview){

overview =
movie.overview.length > 120
? movie.overview.substring(0,120) + "..." 
: movie.overview;

overview = escapeHtml(overview);

}

const card = document.createElement("div");

card.className = "movie-card";

card.innerHTML = `
<img class="movie-poster" src="${poster}" alt="${title}">
<div class="movie-info">
<div class="movie-title">${title}</div>
<div class="movie-date">Release: ${releaseDate}</div>
<div class="movie-overview">${overview}</div>
</div>
`;

movieContainer.appendChild(card);

});

}
 
/* SEARCH MOVIES */

function searchMovies(){

const input =
document.getElementById("searchInput")
.value
.toLowerCase();

const filtered = allMovies.filter(movie =>

movie.title &&
movie.title.toLowerCase().includes(input)

);

displayMovies(filtered);

}

/* SECURITY */

function escapeHtml(text){

const div = document.createElement("div");

div.textContent = text;

return div.innerHTML;

}

function getPosterUrl(movie){

if(movie.poster_path){

if(movie.poster_path.startsWith("http")){
return movie.poster_path;
}

return "https://image.tmdb.org/t/p/w500" + movie.poster_path;

}

if(movie.poster){
return movie.poster;
}

if(movie.image){
return movie.image;
}

return "https://via.placeholder.com/500x750?text=No+Image";

}

loadMovies();

</script>
</body>
</html>
