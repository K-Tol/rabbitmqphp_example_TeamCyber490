
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Dashboard</title>

</head>


<body>

 <div class="topnav">
  <div class="logo">TeamCyber </div>
  <div class = "auth-buttons">
    <button onclick="showLogin()">Sign In</button>
    <button onclick="showRegister()">Register</button>
  </div>

 </div class="hero">
 <h1>Welcome to the Movie Dashboard!</h1>
 <p>
  Sign in to watch your favorite movies!
 </p>
  </div>

<div class = content>
  ,<div class ="section-header">
    <h2>Popular Movies</h2>
    <button class ="Refresh-button" onclick="refreshMovies()">Refresh The facking Movies</button>
  </div>
</div>

<div id="movieContainer">
      <div class="status-box">Loading movies...</div>
    </div>
</div>

<!-- the login place -->
 
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h2>Sign In</h2>
      <input type="text" id="Username" placeholder="Username">
      <input type="password" id="Password" placeholder="Password">

      <button onclick="loginUser()">Sign In</button>
      <button class="close-btn" onclick="closeLogin()">Close</button>

      <div class="form-message" id="loginMessage"></div>
    </div>
  </div>

  <!-- Registeration place -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <h1>Register</h1>
      <input type="text" id="registerUsername" placeholder="Username">
      <input type="password" id="registerPassword" placeholder="Password">

      <button onclick="registerUser()">Register</button>
      <button class="close-btn" onclick="closeRegister()">Close</button>

      <div class="form-message" id="registerMessage"></div>
    </div>
  </div>
<style>


*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Arial, Helvetica, sans-serif;
}

body{
  background: #141414;
  color: #fff;
  min-height: 100vh;

}

.topnav{
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 30px;
  background-color:rgb(0, 0, 0,0.85) #333;
}

.logo{
  font-size: 28px;
  font-weight: bold;
  color: #e50914;
  letter-spacing: 0.5px;
}

.auth-buttons{
  display: flex;
  gap: 10px;
}

.auth-buttons button{
  background-color: #e50914;
  border: none;
  color: #fff;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s ease;
  }

  .auth-buttons button:hover{
    background: #080808;
}



</style>

 </body>
<html>
