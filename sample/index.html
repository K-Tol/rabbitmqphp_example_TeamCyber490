<!doctype html>
<html lang="en">
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    </head>
    <body>
        <h1>Welcome to TeamCyber Movie Site</h1>

        <div class="navbar">
            <a class="default" href="index.html">Home</a>
            <a href="watch_list.html">Watch List</a>
            <a href="forum.html">Forum</a>
           <a href="profile.html">Profile</a>
            <div class="searchbar_top">
                <input type="text" id="searchbar" placeholder="Search...">
                <button type="button" id="search_btn"><i class="fa fa-search"></i></button>
            </div>
            <a href="login.html">Login</a>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
        <script>

            document.getElementById("search_btn").addEventListener("click", GetMovie);

            function GetMovie(){
                movieName = document.getElementById("searchbar").value;
                SendMovieRequest(movieName);
            }

            function SendMovieRequest(movieName){
                var request = new XMLHttpRequest();
                request.open("POST","movie.php",true);
                request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
                request.onreadystatechange= function ()
                {
                    
                    if ((this.readyState == 4)&&(this.status == 200))
                    {
                        MoviePage(this.responseText, movieName);
                    }		
                }
                request.send("type=search_movies&query="+movieName);

            }

            function MoviePage(response, movieName){
                var text = JSON.parse(response);
                if(text.ok === true && text.movies && text.movies.length > 0){
                    text = JSON.stringify(text.movies);
                    sessionStorage.setItem('movieDetails', text);
                    window.location.href = "movieInfo.html";
                }
                else{
                    alert("Either Movie '" + movieName + "' not found or you need to re-search. Please try again");
                }
            }

        </script>
    </body>
</html>
