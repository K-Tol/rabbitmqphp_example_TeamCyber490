<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link rel="stylesheet" href="movieInfo.css">
</head>
<body>
  <h1>Welcome, <?php echo htmlspecialchars($username); ?>, here's your watchlist:</h1>
    
  <div id="div_watchlist"></div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
  </script>

  <script>

    userValidated = false;
    username = "";
    user_id = "";

    watchList = document.getElementById("div_watchlist");
    text = "";


    //function to check if user is logged in
    async function validateUser(){
        response = await fetch('checkLogin.php');
        result = await response.json();
        if(result.status == 'authorized'){
            userValidated = true;
            username = result.username;
            user_id = result.user_id;
        }
        else
            window.location.href = "login.html";
    }

    validateUser().then(() => {
      if(userValidated == true){
        SendWatchListRequest(user_id);
      }
    })

    function SendWatchListRequest(user_id)
    {
      var request = new XMLHttpRequest();
      request.open("POST","watch_list.php",true);
      request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
      request.onreadystatechange= function ()
      {
        
        if ((this.readyState == 4)&&(this.status == 200))
        {
          displayWatchlist(this.responseText);
        }		
      }
      request.send("type=getWatchList&user_id="+user_id);
    }

    function displayWatchlist(response){

      text = JSON.parse(response);

      //string template to display user's watchlist
      text.forEach((movie, index) => {
          movieOptions = 
          `
          <div class="card">
          <div class="card-body">
              <h3 class="card-title">${movie.title}</h3>
              <p class="card-text">${movie.release_date}</p>
              <button class="btn btn-primary" onclick="movieDetails(${index})">Show Movie Details</button>
              <button class="btn btn-primary" onclick="removeWatchList(${index})">Remove From Watchlist</button>            
          </div>
          </div>`;
          div_watchlist.innerHTML += movieOptions; 
      });
    }

  </script>

  <p><a href="/logout.php">Logout</a></p>
</body>
</html>
