<!doctype html>
<html lang="en">
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <link rel="stylesheet" href="movieInfo.css">
    </head>
    <body>

        <label for="options">Choose one of the movies here</label>
        <select name="options" id="options">
            
        </select>

        <div id="test"></div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
            //takes the search query from the database
            infoJSON = sessionStorage.getItem('movieDetails');

            //turns back from a string into an object
            movieArray = JSON.parse(infoJSON);

            //checks to see if the query went through properly
            console.log("Movie Array:", movieArray);

            testing = document.getElementById("test")

            //string template to insert into webpage with entries
            for (let i = 0; i < movieArray.length; i++) {
                movieOptions = 
                `
                <div class="movie">
                <h3>${movieArray[i].title}</h3>
                <img id="moviePoster${i}" src="https://image.tmdb.org/t/p/w200${movieArray[i].poster_path}" alt="${movieArray[i]}.title">
                <p>${movieArray[i].release_date}</p>
                </div>`;
                testing.innerHTML += movieOptions; 


                //Let's the user click on one of the posters to let them see its info (DOESN"T WORK)
                //document.getElementById(`moviePoster${i}`).addEventListener("click", function() {
                //    userChoice(i);
                //})
                
            }
            
            //does not work, fix later
            function userChoice(index){
                document.getElementById("test").innerHTML = "";

                //String template for the selected movie
                movieSelectedOption = 
                `
                <div class="movie">
                <h3>${movieArray[index].title}</h3>
                <img id="moviePoster${index}" src="https://image.tmdb.org/t/p/w200${movieArray[index].poster_path}" alt="${movieArray[index]}.title">
                <p>${movieArray[index].release_date}</p>
                <p>${movieArray[index].overview}</p>
                <button type="button" id="addWatchList">Add To Watch List</button>
                <input type="text" id="review" placeholder="Enter Review Here" required>
                <button type="button" id="submitReview">Submit Review/Rating</button>
                </div>`;
                testing.innerHTML += movieSelectedOption; 
            }

        </script>
        
    </body>
</html>
