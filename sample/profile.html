    </script>
    <script>
        userValidated = false;
        username = "";
        user_id = "";
        
        
        //function to check if user is logged in
        async function validateUser(){
            response = await fetch('checkLogin.php');
            result = await response.json();
            if(result.status == 'authorized'){
                userValidated = true;
                username = result.username;
                user_id = result.user_id;
            }
            else
                window.location.href = "login.html";
        }

        validateUser().then(() => {
        if(userValidated == true){
            showFollowing(user_id);
        }
        })

        //function to grab the user_id tied to a specifc username
        function requestUserId(username){
            return new Promise((resolve, reject) => {
            var request = new XMLHttpRequest();
            request.open("POST","getUser_id.php",true);
            request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
            request.onreadystatechange= function ()
            {
                
                if ((this.readyState == 4)&&(this.status == 200))
                {
                    text = JSON.parse(this.responseText);

                    if(text.status == "got-user_id"){
                        resolve(text.user_id);
                    }
                    else{
                        reject("Something went wrong")
                    }
                }

                }
                request.send("type=get_id&username="+username);
            });
        }


        function showFollowing(){

        }

        async function followUser(){

            userOfInterest = document.getElementById("searchUsername").value;

            target = await requestUserId(userOfInterest);

    
            var request = new XMLHttpRequest();
            request.open("POST","profile.php",true);
            request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
            request.onreadystatechange= function ()
            {
                
                if ((this.readyState == 4)&&(this.status == 200))
                {
                    text = JSON.parse(this.responseText);

                    if(text.status == "added"){
                        alert("Added User to Follow List");
                    }
                    else{
                        alert("User not added, something went wrong");
                    }
                }

                }
                request.send("type=followuser&user_id="+user_id+"&target_user_id="+target); 
        }

    </script>
