<html>
<script>

function HandleLoginResponse(response)
{
	var text = JSON.parse(response);
	document.getElementById("textResponse").innerHTML = "response: "+text+"<p>";

	if(text == "authorized"){
		window.location.href = "welcome.html"
	}
}

function SendLoginRequest(username,password)
{
	var request = new XMLHttpRequest();
	request.open("POST","login.php",true);
	request.setRequestHeader("Content-Type","application/x-www-form-urlencoded");
	request.onreadystatechange= function ()
	{
		
		if ((this.readyState == 4)&&(this.status == 200))
		{
			HandleLoginResponse(this.responseText);
		}		
	}
	request.send("type=login&uname="+username+"&pword="+password);
}
</script>

<h1>Welcome to Team Cyber's Site</h1>
<body>
<div id="textResponse">
# This is the container for both username and password
</div>
<div class="container">

	<input type="text" id="username" placeholder="Username" required>

	<input type="text" id="password" placeholder="Password" required>

	<br>
	<button type="button" id="login">Login</button>
	<button type="button" id="register">Register</button>

<script>
const btn1 = document.getElementById("login");
const btn2 = document.getElementById("register");

var username = document.getElementById("username").value;
var password = document.getElementById("password").value;

btn1.addEventListener("click", SendLoginRequest("username","password"));
btn2.addEventListener("click", SendLoginRequest("username","password"));

</script>
</body>
</html>
