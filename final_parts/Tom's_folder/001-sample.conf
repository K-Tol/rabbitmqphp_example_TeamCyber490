<VirtualHost *:80>
        ServerAdmin webmaster@localhost
        ServerName www.dev-teamcyber.com
        DocumentRoot /var/www/sample

	Redirect permanent / https://www.dev-teamcyber.com/

        ErrorLog ${APACHE_LOG_DIR}/sample_error.log
        CustomLog ${APACHE_LOG_DIR}/sample_access.log combined
</VirtualHost>

<VirtualHost *:443>
        ServerAdmin webmaster@localhost
        ServerName www.dev-teamcyber.com
        DocumentRoot /var/www/sample

        ErrorLog ${APACHE_LOG_DIR}/sample_ssl_error.log
        CustomLog ${APACHE_LOG_DIR}/sample_ssl_access.log combined

        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/server.www.dev-teamcyber.com.crt
        SSLCertificateKeyFile /etc/ssl/private/server.www.dev-teamcyber.com.key
</VirtualHost>
